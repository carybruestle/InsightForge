[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "InsightForge"
version = "0.1.0"
description = "AI-powered sales insight and knowledge base project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2.0",
  "streamlit>=1.30.0",
  "pypdf>=4.0.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.35,<1.0.0",
  "langchain>=0.3.12,<1.0.0",
  "langchain-text-splitters>=0.3.6,<1.0.0",
  "langchain-community>=0.3.0,<1.0.0",
  "langchain-openai>=0.3.8,<1.0.0",
  "pyautogen>=0.2.30",
  "openai>=1.30.0",
  "tiktoken>=0.7.0",
  "faiss-cpu==1.9.0.post1",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "black>=24.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
